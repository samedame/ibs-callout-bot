name: Tests

# Runs the offline test suite on pull requests so a change to a bot can't quietly break its alerts.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pyyaml
      - run: python -m pytest tests -q
