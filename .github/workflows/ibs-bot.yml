name: IBS callout bot

on:
  schedule:
    - cron: '15 21 * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Evening signal run
        if: github.event.schedule == '15 21 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python ibs_callout_bot.py --webhook "$DISCORD_WEBHOOK"

      - name: Check pre-open staleness
        id: staleness
        if: github.event.schedule == '0 13 * * 1-5'
        run: |
          SCHED_TS=$(date -u -d "today 13:00" +%s)
          NOW_TS=$(date -u +%s)
          DELAY=$(( (NOW_TS - SCHED_TS) / 60 ))
          echo "delay_minutes=$DELAY" >> "$GITHUB_OUTPUT"
          echo "Fired $DELAY minutes after the 13:00 UTC schedule"

      - name: Pre-open reminder (on time)
        if: github.event.schedule == '0 13 * * 1-5' && fromJSON(steps.staleness.outputs.delay_minutes) <= 60
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python ibs_callout_bot.py --webhook "$DISCORD_WEBHOOK" --morning

      - name: Pre-open reminder (stale — flag instead of pretending it's fresh)
        if: github.event.schedule == '0 13 * * 1-5' && fromJSON(steps.staleness.outputs.delay_minutes) > 60
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ Pre-open reminder fired ${{ steps.staleness.outputs.delay_minutes }} min late (GitHub Actions scheduling delay, not a code bug). Market is likely already open — today's next-open execution window may be gone. Check state.json directly if you need to act.\"}" \
            "$DISCORD_WEBHOOK"

      - name: Commit state
        run: |
          git config user.name  "ibs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "state $(date -u +%F)"
          git push || true
