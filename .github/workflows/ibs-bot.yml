name: IBS callout bot

on:
  schedule:
    # evening run: 21:15 UTC = 17:15 ET (EDT) / 16:15 ET (EST) -> after the close, both halves of the year
    - cron: '15 21 * * 1-5'
    # pre-open reminder: 13:00 UTC = 09:00 ET (EDT) / 08:00 ET (EST)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Evening signal run
        if: github.event.schedule == '15 21 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python ibs_callout_bot.py --webhook "$DISCORD_WEBHOOK"
      - name: Pre-open reminder
        if: github.event.schedule == '0 13 * * 1-5'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python ibs_callout_bot.py --webhook "$DISCORD_WEBHOOK" --morning
      - name: Commit state
        run: |
          git config user.name  "ibs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "state $(date -u +%F)"
          git push || true
