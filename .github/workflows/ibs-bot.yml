name: IBS callout bot

on:
  schedule:
    # Evening signal run (unchanged).
    - cron: '15 21 * * 1-5'
    # BACKUP for the pre-open reminder. The primary trigger is the open-scheduler Worker (09:00 ET, exact).
    # These fire at 09:07 ET and are silenced by run_guard.py if the Worker already ran (or if off-season).
    - cron: '7 13 * * 1-5'   # 09:07 EDT (UTC-4)
    - cron: '7 14 * * 1-5'   # 09:07 EST (UTC-5)
  workflow_dispatch:
    inputs:
      mode:
        description: "evening = signal run, morning = pre-open reminder"
        type: choice
        options: [evening, morning]
        default: evening
      scheduled_for_et:
        description: "Intended fire time (ET, ISO-8601). Set by open-scheduler."
        required: false
        default: ""
      trigger:
        description: "Who started this run (cf-scheduler | test | manual)"
        required: false
        default: "manual"

# A late backup can never overlap the primary run.
concurrency:
  group: ibs-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Evening signal run
        if: github.event.schedule == '15 21 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'evening')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python ibs_callout_bot.py --webhook "$DISCORD_WEBHOOK"

      # Replaces the old "Check pre-open staleness" + "stale" curl steps. run_guard.py does the lateness
      # check against the INTENDED time, suppresses duplicates, and posts one clear notice if too late.
      - name: Pre-open reminder (guarded)
        if: github.event.schedule == '7 13 * * 1-5' || github.event.schedule == '7 14 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SCHEDULED_FOR_ET: ${{ inputs.scheduled_for_et }}
          RUN_TRIGGER: ${{ inputs.trigger || github.event_name }}
        run: |
          python run_guard.py --job ibs-preopen --target 09:00 --usable-until 09:29 --on-too-late notice -- \
            python ibs_callout_bot.py --webhook "$DISCORD_WEBHOOK" --morning

      - name: Commit state
        run: |
          git config user.name  "ibs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git add .run_guard.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state $(date -u +%F)"
          git push || (git pull --rebase --autostash && git push) || true
