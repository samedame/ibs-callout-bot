name: Momentum sleeve bot

on:
  schedule:
    # daily after-close check; the script itself only acts on the first run of a new month
    - cron: '25 21 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Monthly rebalance check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python momentum_sleeve_bot.py --webhook "$DISCORD_WEBHOOK"
      - name: Commit state
        run: |
          git config user.name  "momentum-sleeve-bot"
          git config user.email "bot@users.noreply.github.com"
          git add momentum_state.json || true
          git diff --cached --quiet || git commit -m "momentum state $(date -u +%F)"
          git push || true
