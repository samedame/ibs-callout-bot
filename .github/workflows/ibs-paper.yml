name: IBS 85% cap paper comparison

on:
  schedule:
    - cron: '43 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ibs-paper-comparison
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Update paper comparison
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
        run: python ibs_paper_compare.py
      - name: Save paper ledger
        run: |
          git add -- paper_ibs/comparison.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=ibs-paper -c user.email=bot@users.noreply.github.com commit -m "Update IBS paper comparison"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            sleep "$((attempt * 3))"
          done
          exit 1
